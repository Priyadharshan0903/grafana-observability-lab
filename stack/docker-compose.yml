name: grafana-learnings

services:
  checkout:
    build: ./app
    environment:
      RPS: "20"
      ERROR_RATE: "0.001" # 0.1% errors: comfortably inside a 99.8% SLO
      SLOW_RATE: "0.005"
    ports:
      - "127.0.0.1:8091:8080"

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle # lets you reload config: curl -X POST localhost:9090/-/reload
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin # local learning stack only
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3300:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
